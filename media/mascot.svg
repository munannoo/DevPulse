<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Soft Plush Body Gradient -->
    <linearGradient id="bodyGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <!-- Top Highlight -->
    <linearGradient id="softLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Belly Patch -->
    <linearGradient id="bellyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <!-- Spark / Antenna Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Blush Glow -->
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Antenna with Spark -->
  <path d="M 32 17 Q 30 10 35.5 5.5" fill="none" stroke="#a855f7" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="36" cy="5" r="3.5" fill="url(#sparkGrad)"/>
  <polygon points="36,1.5 37.2,3.8 39.5,5 37.2,6.2 36,8.5 34.8,6.2 32.5,5 34.8,3.8" fill="#fbbf24"/>

  <!-- Little Nubbly Arms -->
  <circle cx="13.5" cy="38" r="4.5" fill="#9333ea"/>
  <circle cx="50.5" cy="38" r="4.5" fill="#9333ea"/>

  <!-- Chubby Egg/Pear Mascot Body -->
  <path d="M 32 15 C 44 15 51.5 24 51.5 37.5 C 51.5 50.5 43.5 58 32 58 C 20.5 58 12.5 50.5 12.5 37.5 C 12.5 24 20 15 32 15 Z" fill="url(#bodyGrad)"/>

  <!-- Top Head Soft Glow -->
  <ellipse cx="32" cy="21" rx="11" ry="4" fill="url(#softLight)"/>

  <!-- Chubby Belly Patch -->
  <path d="M 32 35 C 39.5 35 43.5 41 43.5 48 C 43.5 54 38.5 56 32 56 C 25.5 56 20.5 54 20.5 48 C 20.5 41 24.5 35 32 35 Z" fill="url(#bellyGrad)"/>

  <!-- Rosy Blushing Cheeks -->
  <circle cx="21" cy="36" r="4.5" fill="url(#blushGrad)"/>
  <circle cx="43" cy="36" r="4.5" fill="url(#blushGrad)"/>

  <!-- Big Sparkly Eyes (Meta Muse / Jolly Style) -->
  <!-- Left Eye -->
  <ellipse cx="25" cy="31" rx="3.2" ry="4.2" fill="#0f172a"/>
  <circle cx="23.9" cy="29.4" r="1.6" fill="#ffffff"/>
  <circle cx="26.3" cy="32.8" r="0.75" fill="#ffffff"/>

  <!-- Right Eye -->
  <ellipse cx="39" cy="31" rx="3.2" ry="4.2" fill="#0f172a"/>
  <circle cx="37.9" cy="29.4" r="1.6" fill="#ffffff"/>
  <circle cx="40.3" cy="32.8" r="0.75" fill="#ffffff"/>

  <!-- Sweet Cheerful Smile -->
  <path d="M 29.5 37 Q 32 40.2 34.5 37" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Cute DevPulse heart line on tummy -->
  <path d="M 27 48.5 H 29.5 L 30.5 46.5 L 32 50.5 L 33.5 48.5 H 37" fill="none" stroke="#a855f7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
</svg>
